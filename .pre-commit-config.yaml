# pre-commit (pre-commit.com) — language-agnostic git hooks, no Node required.
# Install once: `mise run hooks`  (runs `pre-commit install --install-hooks`)
#
# Merges are squash-only, so per-commit message linting is pointless — the PR
# title is what becomes the commit subject and CI (.github/workflows/pr-title.yml)
# checks that instead.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # internal/testdata holds verbatim, scrubbed HTTP recordings — never
      # reformat them.
      - id: trailing-whitespace
        exclude: ^internal/testdata/
      - id: end-of-file-fixer
        exclude: ^internal/testdata/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
        pass_filenames: true
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --new-from-rev HEAD --fix
        language: system
        types: [go]
        pass_filenames: false
