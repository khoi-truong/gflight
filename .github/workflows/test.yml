name: Tests
run-name: "${{ github.workflow }} · ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# Each job installs only the tools it needs (setup-go `install-args`); don't let
# `mise run` silently pull the whole toolchain back in.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed paths
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_detect-changes.yml

  build-test:
    name: Build and test
    needs: detect-changes
    if: needs.detect-changes.outputs.active == 'true' && needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-go
        with:
          install-args: go
      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Build
        run: go build -trimpath ./...
      - name: Run tests with race detector
        run: mise run test

  # Single stable status for branch protection — see check-code-quality.yml.
  test-gate:
    name: Test gate
    if: always()
    needs: [detect-changes, build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify no job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
