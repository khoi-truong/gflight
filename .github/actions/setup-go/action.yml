name: Set up toolchain
description: >
  Provisions the Go toolchain and dev tools via mise (single source of truth),
  with mise-tool and Go module/build caching. Pass install-args to install only
  the tools a job needs. Runs after actions/checkout.

inputs:
  go-cache:
    description: Restore/save the Go module + build cache (disable for non-Go jobs).
    default: "true"
  install-args:
    description: >
      Restrict `mise install` to specific tools (space-separated), e.g.
      "go golangci-lint" for a job that only lints. Empty installs everything
      in mise.toml.
    default: ""

runs:
  using: composite
  steps:
    - name: Install tools with mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        # Pin the bootstrapper: mise-action resolves "latest" from a channel that
        # can point at a tag whose release assets are not published yet (v2026.9.3
        # 404'd on linux-x64). Bump deliberately. Tool versions still live in mise.toml.
        version: 2026.9.2
        experimental: true
        cache: true
        install_args: ${{ inputs.install-args }}

    - name: Cache Go modules and build output
      if: inputs.go-cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        # Key convention: <item>-<os>-<inputs hash>-<git sha>. Item name first so
        # keys sort and grep by what they cache; os before the hashes.
        # SHA-suffixed so the build cache is re-saved every run (a fixed key is
        # written once and then goes stale); restore-keys fall back to the newest.
        key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-
          go-${{ runner.os }}-
